r ?","finalText":"Un premier échange permet de poser la question, d’identifier les données nécessaires et de déterminer les scénarios à comparer avec vos autres conseils.","finalCta":"Parler de votre décision","finalCtaSecondary":"Écrire à RB Partners"},"en":{"metaTitle":"Owner-manager advisory — RB Partners","metaDescription":"Compensation, dividends, holding structures, sale, succession and personal tax: quantified scenarios coordinated with your other advisers.","eyebrow":"Owner-manager advisory","title":"One contact for owner-manager decisions.","lead":"Compensation, dividends, holding structures, sale, succession or personal tax: we quantify the options and coordinate them with your other advisers.","cta":"Speak with a partner","proofs":["Compensation","Dividends","Holding structures","Sale & succession"],"scopeEye":"What we do","scopeTitle":"Concrete trade-offs, quantified.","scopeLead":"We start from your company, your owner-manager position and your plans before comparing options.","scope":[["Owner-manager compensation","Comparison of salary, dividend and social-status scenarios based on your position, company capacity and objectives."],["Dividends & cash upstreaming","Analysis of distributable capacity and possible flows between entities, taking account of the group’s cash needs."],["Holding & group organisation","Review of entity roles and flows, including cash upstreaming or preparation for a new group stage; legal formalities are handled through our Legal & company formation service."],["Sale & succession","Scenarios around a sale or transfer, potentially including contribution-sale structures or French business-transmission regimes, coordinated with lawyers, notaries and other advisers."],["Owner-manager personal tax","Coordinated review of French personal tax and wealth-tax matters, including non-resident or inbound situations, with other advisers where needed."]],"promiseEye":"Who we support","promiseTitle":"Advice changes with the owner-manager’s situation.","promiseLead":"An annual compensation decision is not approached in the same way as a business sale or a move to France.","promises":[["SME owner-manager","We look at compensation, dividends, company cash and upcoming plans together. The aim is to compare options that are coherent for both the company and the owner-manager."],["Owner-manager preparing a sale or succession","We work on the accounting and tax scenarios relevant to the decision and coordinate implementation with lawyers, notaries or other advisers."],["Foreign, expatriate or inbound owner-manager","We review the French consequences of the situation in connection with the company and compensation. Specific cross-border matters are coordinated with advisers in the relevant jurisdictions."]],"processEye":"How we work","processTitle":"Four steps before deciding.","processLead":"The decision is prepared from your actual position and then coordinated with the relevant advisers.","process":[["Review the situation","We gather information on the company, group, current compensation, plans and personal circumstances relevant to the analysis."],["Build the diagnosis","We identify cash, structure, social-status and tax constraints that frame the decision."],["Compare scenarios","We place several options side by side and quantify their main consequences for both the company and the owner-manager."],["Coordinate implementation","Where the decision requires specific legal acts or specialist advice, we work with your lawyer, notary or wealth adviser."]],"engagementEye":"Focus","engagementTitle":"Compare before deciding.","engagementValue":"Quantified scenarios","engagementText":"Options are shown side by side with their main consequences for the company and the owner-manager. The review meeting explains the assumptions, differences between scenarios and implementation steps.","faqTitle":"Frequently asked questions","faq":[["Can you tell me whether salary or dividends are better?","We can compare the options,
