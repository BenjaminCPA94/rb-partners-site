["Pouvez-vous nous aider à choisir une plateforme ?","Oui. Nous partons de vos volumes, de vos flux, de votre organisation et de vos outils actuels pour définir les besoins. Nous pouvons ensuite vous aider à sélectionner une plateforme agréée adaptée et à organiser son paramétrage. Nous ne recommandons pas de multiplier les outils sans nécessité opérationnelle."],["Faut-il changer de logiciel comptable ?","Pas nécessairement. La réforme impose surtout de passer par une plateforme agréée pour les flux concernés. Nous examinons donc la compatibilité de votre organisation actuelle, y compris avec Pennylane lorsque vous l’utilisez, avant de proposer des adaptations."],["Pouvez-vous accompagner plusieurs sociétés d’un même groupe ?","Oui. Nous pouvons cartographier les flux de plusieurs entités et identifier les règles communes ou spécifiques à chacune. Cela permet notamment de traiter les circuits intersociétés, les rôles locaux et les flux internationaux de façon cohérente."],["Suis-je concerné si je ne vends qu’à des particuliers ?","Les ventes B2C ne relèvent pas du même circuit de facturation électronique entre entreprises, mais elles sont concernées par le e-reporting lorsqu’elles entrent dans le champ de la réforme. Votre entreprise reste également concernée par la réception électronique de ses factures fournisseurs. Nous examinons vos flux pour déterminer les obligations applicables."],["Qu’est-ce qui change pour mes factures fournisseurs ?","Depuis le 1er septembre 2026, les entreprises concernées doivent être en mesure de recevoir leurs factures électroniques via une plateforme agréée. Le circuit de réception, validation et intégration comptable doit donc être organisé autour de cette plateforme. Nous vérifions également qui valide les factures et comment les pièces rejoignent la comptabilité."]],"finalTitle":"Faisons le point sur vos flux de facturation.","finalText":"Un premier échange permet de cartographier vos ventes, achats, outils et circuits de validation afin d’identifier les adaptations prioritaires.","finalCta":"Faire le point sur vos flux","finalCtaSecondary":"Écrire à RB Partners"},"en":{"metaTitle":"E-invoicing — RB Partners","metaDescription":"Mandatory receipt since September 2026, issuance phased by company size: flow diagnostic, accredited platform, e-reporting and Pennylane organisation.","eyebrow":"E-invoicing","title":"The reform is now operational.","lead":"Since 1 September 2026, electronic invoice receipt is mandatory for affected businesses, with issuance phased by company size. We organise your flows, accredited platform and internal processes.","cta":"Speak with a partner","proofs":["Receipt 2026","Issuance 2026 / 2027","Accredited platform","E-reporting"],"scopeEye":"What we do","scopeTitle":"Organise the flows, not just the software.","scopeLead":"We start from sales, purchases and internal workflows to prepare the operating model required by the reform.","scope":[["Flow diagnostic","Mapping of sales, purchases, B2B, B2C and international transactions, together with current tools and responsibilities."],["Accredited platform & setup","Selection and configuration of the accredited platform in line with the accounting setup and, where used, Pennylane."],["Invoices & customer master data","Review of required invoice and customer data, including SIREN and transaction category where applicable."],["E-reporting","Organisation of data transmission for transactions outside e-invoicing, together with the payment data concerned."],["Teams & first cycles","Definition of roles, approval workflow, user support and review of the first invoice issuance and receipt cycles."]],"promiseEye":"Who we support","promiseTitle":"The workstream differs from one company to another.","promiseLead":"The starting point depends on company size, tools and the complexity of invoice flows.","promises":[["SME required to issue in 2027","You already need to receive e-invoices and must prepare issuance before your deadline. We use this period to clean master data, define the target workflow and test the organisation."],["Company already receiving e-invoices","The platform may be in place while approvals, documents and responsibilities remain unchanged. We review the actual workflow to remove duplicate processing and unclear hand-offs."],["Multi-entity group or subsidiary","We map flows by entity, including international and B2C transactions, then define responsibilities between local teams, headquarters and tools."]],"processEye":"How we work","processTitle":"Four steps to the target workflow.","processLead":"We work from your actual flows and the obligations that apply to your business.","process":[["Map","We identify sales, purchases, customer types, international transactions, tools and approval workflows."],["Choose the setup","We define the accredited platform and the invoice and data-flow model suited to the company."],["Configure","We update master data, required invoice information, access rights and processing rules with the relevant teams."],["Review first cycles","We check the first issuance, receipt and data-transmission cycles to identify necessary adjustments."]],"engagementEye":"SME deadline","engagementTitle":"Prepare issuance before it becomes urgent.","engagementValue":"1 September 2027","engagementText":"By this date, affected SMEs and micro-enterprises must issue electronic invoices and transmit e-reporting data. Before then, the priority is master data, the accredited platform, internal workflows and testing with teams.","faqTitle":"Frequently asked questions","faq":[["Can you help us choose a platform?","Yes. We start from your volumes, flows, organisation and existing tools to define requirements. We can then help select an appropriate accredited platform and organise its setup. We do not recommend adding tools without an operational reason."],["Do we need to change accounting software?","Not necessarily. The reform mainly requires the relevant flows to pass through an accredited platform. We therefore review the compatibility of your current setup, including Pennylane where you use it, before proposing changes."],["Can you support several companies in one group?","Yes. We can map the flows of several entities and identify common and entity-specific rules. This is particularly useful for intercompany processes, local responsibilities and international transactions."],["Are we affected if we only sell to consumers?","B2C sales do not follow the same B2B e-invoicing flow, but they can fall within e-reporting. Your business is also affected by the requirement to receive electronic supplier invoices. We review the flows to determine which obligations apply."],["What changes for supplier invoices?","Since 1 September 2026, affected businesses must be able to receive electronic invoices through an accredited platform. Receipt, approval and accounting integration therefore need to be organised around that platform. We also review who approves invoices and how supporting documents reach accounting."]],"finalTitle":"Let’s review your invoice flows.","finalText":"A first conversation maps your sales, purchases, tools and approval workflows to identify the priority changes.","finalCta":"Review your invoice flows","finalCtaSecondary":"Email RB Partners"}};</script>
