ques sont calibrées selon les besoins du dirigeant et de la direction financière."],["Filiale française d’un groupe étranger","Nous articulons obligations françaises, reporting FR/EN, comptes intragroupe, package de consolidation et calendrier de la maison mère."],["Société en transition ou en croissance","Nous reprenons les historiques, identifions les sujets ouverts et remettons en place les outils, responsabilités et échéances lors d’un changement de cabinet ou d’une phase de croissance."]],"processEye":"Notre méthode","processTitle":"Un fonctionnement clair dès le départ.","processLead":"Quatre étapes concrètes pour reprendre le dossier et installer un rythme de travail lisible.","process":[["Reprendre le dossier","Nous récupérons la comptabilité, les déclarations, les FEC, les immobilisations et les éléments utiles auprès de vos équipes et, le cas échéant, du précédent cabinet."],["Paramétrer les outils et les flux","Nous organisons Pennylane, les banques, les factures, les accès et les circuits de validation en définissant les responsabilités de chacun."],["Tenir les comptes et déclarer","Nous réalisons les traitements comptables, rapprochements, contrôles et déclarations fiscales selon le calendrier défini avec vous."],["Clôturer et restituer","Nous préparons les comptes annuels ou situations intermédiaires, traitons les points de clôture et vous remettons les principaux livrables."]],"engagementEye":"Engagement","engagementTitle":"Une question ne reste pas sans réponse.","engagementValue":"48h","engagementText":"Nous nous engageons à apporter une première réponse à vos demandes sous 48 heures ouvrées. Lorsqu’un sujet nécessite une analyse complémentaire, nous vous indiquons sa prise en charge et les prochaines étapes.","faqTitle":"Questions fréquentes","faq":[["Pouvez-vous reprendre un dossier en cours d’exercice ?","Oui. Nous pouvons reprendre la comptabilité sans attendre la prochaine clôture. Nous organisons la transmission des balances, grands livres, FEC, déclarations fiscales et autres éléments utiles. Nous faisons ensuite le point sur les écritures à reprendre, les échéances à venir et les sujets encore ouverts."],["Travaillez-vous avec Pennylane ?","Oui. Pennylane peut centraliser les factures, les flux bancaires, les justificatifs et les échanges liés à la comptabilité. Nous organisons le paramétrage du dossier et les circuits de validation avec votre équipe. Chacun sait ainsi où déposer, valider et retrouver l’information."],["Pouvez-vous produire un reporting pour une maison mère étrangère ?","Oui. Nous pouvons préparer des reportings périodiques en français ou en anglais selon le format demandé par le groupe. Cela peut inclure un mapping du plan de comptes, des rapprochements intragroupe, des retraitements vers les normes du groupe et un package de consolidation. Le calendrier est défini à partir des dates de clôture de la maison mère."],["Pouvez-vous établir des situations comptables en cours d’année ?","Oui. Une situation peut être préparée mensuellement, trimestriellement ou à une date spécifique selon vos besoins. Elle comprend une revue des principaux comptes et les écritures nécessaires à la période. Le contenu et le niveau de détail sont définis selon l’usage attendu."],["Comment gérez-vous la facturation électronique ?","Nous intégrons la réforme de la facturation électronique dans l’organisation du dossier. Nous examinons votre circuit de facturation, de réception et de validation des pièces afin de l’adapter aux nouvelles obligations. Lorsque Pennylane est utilisé, nous veillons à la cohérence entre ce circuit et le reste du processus comptable."]],"finalTitle":"Faisons le point sur votre organisation comptable.","finalText":"Un premier échange de 30 minutes permet de comprendre votre organisation actuelle, vos outils, vos échéances fiscales et, le cas échéant, les attentes de votre maison mère.","finalCta":"Réserver un échange de 30 min","finalCtaSecondary":"Écrire à RB Partners"},"en":{"metaTitle":"Compliance & accounting — RB Partners","metaDescription":"Bookkeeping, VAT, French tax filings, year-end accounts, tax returns and FR/EN group reporting for SMEs and French subsidiaries of international groups.","eyebrow":"Compliance & accounting","title":"Your accounts, tax filings and reporting.","lead":"Bookkeeping and review, VAT and tax filings, year-end accounts, tax returns and FR/EN reporting: we organise your accounting around your deadlines and internal organisation.","cta":"Speak with a partner","proofs":["Bookkeeping & review","VAT & tax","Accounts & tax return","FR / EN reporting"],"scopeEye":"What we do","scopeTitle":"Your accounting, from day-to-day to year-end.","scopeLead":"We define who does what, how often and which deliverables are expected.","scope":[["Bookkeeping & review","Transaction flows, bank reconciliations, account reviews, supporting-document follow-up and preparation of the review file."],["VAT & tax filings","VAT returns, corporate income tax instalments and balance, CFE, CVAE, DAS2 and other filings applicable to your company."],["Year-end, accounts & tax return","Year-end entries and account substantiation, followed by financial statements, notes, French tax return and FEC."],["FR / EN group reporting","Periodic reporting, English-language reporting, group-GAAP adjustments, consolidation packages and alignment with the parent company calendar."],["E-invoicing & tools","Invoice workflows, Pennylane, document collection and approval processes organised around the ongoing French e-invoicing reform."]],"promiseEye":"Who we support","promiseTitle":"A setup adapted to your organisation.","promiseLead":"The same accounting fundamentals, with a different operating model depending on your structure and constraints.","promises":[["Established SME","We organise accounting production, tax filings and year-end work around your management rhythm. Periodic accounts are calibrated to the needs of management and the finance team."],["French subsidiary of an international group","We connect French statutory requirements with FR/EN reporting, intercompany accounts, consolidation packages and the parent company closing calendar."],["Company in transition or growth","We take over historical data, identify open items and reset tools, responsibilities and deadlines when you change firm or when the accounting organisation has not kept pace with growth."]],"processEye":"How we work","processTitle":"A clear operating model from day one.","processLead":"Four practical steps to take over the file and establish a clear working rhythm.","process":[["Take over the file","We collect accounting records, tax filings, FEC files, fixed-asset data and other relevant information from your team and, where applicable, the previous accounting firm."],["Set up tools and workflows","We organise Pennylane, bank feeds, invoices, access rights and approval workflows, with clear responsibilities for each stakeholder."],["Maintain accounts and file returns","We complete accounting processing, reconciliations, reviews and French tax filings according to the agreed calendar."],["Close and report","We prepare annual accounts or interim statements, address closing items and deliver the agreed accounting and reporting outputs."]],"engagementEye":"Service commitment","engagementTitle":"Your question does not disappear into a queue.","engagementValue":"48h","engagementText":"We commit to providing an initial response to your requests within 48 business hours. When a matter requires further analysis, we confirm that it is being handled and explain the next steps.","faqTitle":"Frequently asked questions","faq":[["Can you take over during the financial year?","Yes. We can take over the accounting without waiting for the next year-end. We organise the transfer of trial balances, ledgers, FEC files, tax filings and other relevant information. We then review entries to be addressed, upcoming deadlines and any open items."],["Do you work with Pennylane?","Yes. Pennylane can centralise invoices, bank flows, supporting documents and accounting-related exchanges. We organise the file setup and approval workflows with your team. This gives each stakeholder a clear place to submit, approve and retrieve information."],["Can you report to a foreign parent company?","Yes. We can prepare periodic reports in French or English using the group’s required format. This may include chart-of-accounts mapping, intercompany reconciliations, group-GAAP adjustments and consolidation packages. The reporting calendar is built around the parent company’s closing deadlines."],["Can you prepare interim accounts during the year?","Yes. Interim accounts can be prepared monthly, quarterly or at a specific date depending on your needs. They include a review of the main accounts and the entries required for the period. The level of detail is defined according to how the information will be used."],["How do you handle French e-invoicing?","We integrate the e-invoicing reform into the accounting setup. We review your current invoice issuing, receipt and approval workflows and adapt them to the new requirements. When Pennylane is used, we make sure the invoice workflow remains consistent with the rest of the accounting process."]],"finalTitle":"Let’s review your accounting organisation.","finalText":"A first 30-minute conversation helps us understand your current setup, tools, French tax deadlines and, where relevant, the reporting requirements of your parent company.","finalCta":"Book a 30-minute call","finalCtaSecondary":"Email RB Partners"}};</script>
