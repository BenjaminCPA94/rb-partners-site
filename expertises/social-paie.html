la maison mère peuvent être réalisés en anglais. Les questions de mobilité internationale ou de droit du travail nécessitant une analyse spécialisée sont coordonnées avec les conseils compétents."],["Pouvez-vous reprendre une paie en cours d’année ?","Oui. Nous reprenons les données salariés, les cumuls de paie, les paramétrages et les déclarations disponibles. Un contrôle de reprise permet d’identifier les points à corriger ou à compléter avant le prochain cycle."],["Gérez-vous les contrats de travail ?","Nous pouvons préparer les documents courants relevant de notre mission et les éléments nécessaires à l’embauche. Lorsqu’une clause ou une situation requiert un conseil spécialisé en droit du travail, nous travaillons avec l’avocat de l’entreprise. Le périmètre est défini au démarrage."],["Comment déterminez-vous la convention collective applicable ?","Nous examinons l’activité de l’entreprise, son organisation et les informations disponibles. Lorsque l’identification nécessite une analyse juridique particulière, nous recommandons une validation avec un conseil spécialisé. La convention retenue conditionne ensuite plusieurs paramètres de paie."],["Comment vous transmettons-nous les variables de paie ?","Le circuit est défini lors de la mise en place du dossier. Les variables peuvent être centralisées dans l’outil collaboratif retenu ou selon un format convenu avec votre équipe. L’objectif est d’avoir une source identifiée et un calendrier stable."]],"finalTitle":"Organisons votre paie et vos échéances sociales.","finalText":"Un premier échange permet de passer en revue vos effectifs, votre convention collective, votre organisation actuelle et les événements que vous devez gérer.","finalCta":"Parler de votre paie","finalCtaSecondary":"Écrire à RB Partners"},"en":{"metaTitle":"Payroll & HR — RB Partners","metaDescription":"French payroll, DSN, hiring, leavers and social administration for SMEs, French subsidiaries and foreign companies employing in France.","eyebrow":"Payroll & HR","title":"Your payroll, from hiring to leaving.","lead":"Payslips, DSN, contracts, joiners, leavers and social administration: we organise French payroll and employee events.","cta":"Speak with a partner","proofs":["Payslips & DSN","Hiring","Leavers","Social administration"],"scopeEye":"What we do","scopeTitle":"French payroll operations, month after month.","scopeLead":"We define the variable-payroll workflow, responsibilities and documents required for each deadline.","scope":[["Payroll & DSN","Payslips, monthly and event-based DSN filings, URSSAF and pension-fund declarations, depending on the file."],["Hiring","Employment documents within the engagement scope, DPAE, employee data collection and health/provident scheme enrolment."],["Leavers & events","Sick leave, parental leave, changes and departures: final payroll documents, work certificate and France Travail certificate."],["Social administration","Employee register follow-up, social deadlines and information required for recurring employer obligations."],["Foreign companies & mobility","French payroll for local teams, foreign employers without a French establishment where applicable, mobility or secondment, with reporting available in English."]],"promiseEye":"Who we support","promiseTitle":"A payroll setup adapted to your team.","promiseLead":"The level of support changes with headcount, internal organisation and your presence in France.","promises":[["Company hiring its first employees","We set up the payroll file, calendar, enrolments and variable-payroll workflow. The first hires are integrated into a clear process."],["Growing SME","We structure variable collection, absences and employee events so they are not handled across scattered channels. Follow-up reflects your collective agreement and HR organisation."],["Foreign company hiring in France","We set up French payroll and social obligations with communication available in English. Complex international mobility matters are coordinated with specialist advisers where needed."]],"processEye":"How we work","processTitle":"Four steps to structure payroll.","processLead":"Reliable payroll starts with correctly transferred data and a calendar understood by all.","process":[["Take over the payroll file","We collect contracts, payroll totals, settings, schemes, collective agreement and relevant employee data."],["Configure","We review file information, enrolments and payroll rules applicable to your organisation."],["Produce each month","You send variables through the agreed workflow; we prepare payslips, checks and social filings."],["Track employee events","Hiring, absences, contractual changes and departures are integrated into the calendar with the required documents."]],"engagementEye":"Focus","engagementTitle":"A payroll calendar agreed in advance.","engagementValue":"Payroll calendar","engagementText":"The cut-off for payroll variables and the payslip delivery calendar are agreed with you during onboarding. Exceptional employee events are reported as they occur so they can be included in the appropriate payroll cycle.","faqTitle":"Frequently asked questions","faq":[["Can you manage payroll for a foreign-owned French entity?","Yes. We can set up and manage French payroll for a subsidiary or local team. Communication with headquarters can be in English. International mobility or employment-law matters requiring specialist advice are coordinated with the relevant advisers."],["Can you take over payroll during the year?","Yes. We take over employee data, payroll totals, settings and available filings. A takeover review identifies any items that need correction or completion before the next cycle."],["Do you handle employment contracts?","We can prepare routine documents within our engagement and the information required for hiring. Where a clause or situation requires specialist employment-law advice, we work with the company’s lawyer. The scope is agreed at the outset."],["How do you determine the applicable collective agreement?","We review the company’s activity, organisation and available information. Where identification requires specific legal analysis, we recommend validation with specialist counsel. The selected agreement then affects several payroll settings."],["How do we send payroll variables?","The workflow is defined when the payroll file is set up. Variables can be centralised in the chosen collaborative tool or through a format agreed with your team. The objective is to maintain one identified source and a stable calendar."]],"finalTitle":"Organise your payroll and social deadlines.","finalText":"A first conversation reviews your headcount, collective agreement, current organisation and the employee events you need to manage.","finalCta":"Discuss your payroll","finalCtaSecondary":"Email RB Partners"}};</script>
