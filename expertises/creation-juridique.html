rons la forme, le régime fiscal et les formalités nécessaires à l’immatriculation. Une fois la société créée, la mise en place comptable et fiscale peut prendre le relais."],["Dirigeant qui crée une holding ou une filiale","Nous coordonnons les formalités de création avec l’organisation existante du groupe. Les arbitrages de rémunération ou de situation personnelle sont traités séparément dans notre mission Conseil au dirigeant."],["Groupe étranger qui s’implante en France","Nous aidons à structurer le véhicule français retenu et à réunir les documents nécessaires, avec coordination de la maison mère. Les opérations complexes sont traitées avec l’avocat du groupe lorsque nécessaire."]],"processEye":"Notre méthode","processTitle":"Quatre étapes jusqu’au démarrage.","processLead":"Nous distinguons les choix à prendre, les formalités à accomplir et la mise en place après immatriculation.","process":[["Comprendre le projet","Nous faisons le point sur l’activité, les associés, le groupe existant et les objectifs de la structure."],["Formuler une recommandation","Nous présentons les options pertinentes de forme et de régime fiscal, avec leurs principales conséquences pour le projet."],["Rédiger & formaliser","Nous préparons les documents relevant de notre mission et coordonnons le dépôt via le guichet unique et les formalités associées."],["Mettre en place la société","Après l’immatriculation, nous organisons le démarrage comptable et fiscal et les premières échéances de la nouvelle structure."]],"engagementEye":"Mise en avant","engagementTitle":"De la décision au démarrage de la société.","engagementValue":"Clé en main","engagementText":"Nous coordonnons les étapes courantes depuis le choix de la structure jusqu’à l’immatriculation. Le dossier peut ensuite basculer directement vers la mise en place comptable et fiscale, sans multiplier les circuits d’information.","faqTitle":"Questions fréquentes","faq":[["Pouvez-vous créer une société entièrement à distance ?","Une grande partie du processus peut être organisée à distance. La faisabilité dépend toutefois de la situation des associés, des documents à signer et des formalités propres au dossier. Nous vous indiquons dès le démarrage les pièces et éventuelles démarches spécifiques nécessaires."],["Accompagnez-vous les holdings ?","Oui, pour la création et le suivi courant relevant de notre mission. Nous examinons la place de la holding dans l’organisation du groupe et coordonnons les formalités nécessaires. Les arbitrages personnels du dirigeant sont traités dans la mission Conseil au dirigeant et les opérations complexes avec les conseils spécialisés."],["Pouvez-vous reprendre le juridique annuel d’une société existante ?","Oui. Nous reprenons les statuts, derniers procès-verbaux, registres et informations utiles afin de vérifier l’historique disponible. Les prochaines approbations de comptes et formalités sont ensuite intégrées au calendrier du dossier."],["Quels documents faut-il pour un associé ou dirigeant étranger ?","Les pièces dépendent de la qualité de la personne, de son pays de résidence et de la structure créée. Nous établissons la liste documentaire adaptée au dossier et signalons les besoins éventuels de traduction, légalisation ou formalités complémentaires."],["Filiale ou succursale : pouvez-vous nous aider à choisir ?","Oui, dans le cadre de notre mission et en coordination avec vos autres conseils lorsque nécessaire. Le choix dépend notamment du niveau d’autonomie recherché, de l’organisation du groupe et des conséquences comptables, fiscales et juridiques. Nous mettons ces éléments en regard avant le lancement des formalités."]],"finalTitle":"Parlons de votre projet de société.","finalText":"Un premier échange permet de comprendre l’activité, les associés, l’organisation du groupe et les formalités à prévoir avant de lancer la création.","finalCta":"Présenter votre projet","finalCtaSecondary":"Écrire à RB Partners"},"en":{"metaTitle":"Legal & company formation — RB Partners","metaDescription":"French SAS, SASU, SARL and EURL formation, articles, registration, annual corporate work and routine changes for SMEs and international groups.","eyebrow":"Legal & company formation","title":"Launch and evolve your French company.","lead":"Entity choice, articles, registration and annual corporate work: we coordinate routine formalities from incorporation through the life of the company.","cta":"Speak with a partner","proofs":["Entity choice","Articles & registration","Annual corporate work","Routine changes"],"scopeEye":"What we do","scopeTitle":"From incorporation to annual formalities.","scopeLead":"We handle routine corporate work within our engagement and coordinate specialist advisers where the project requires it.","scope":[["Legal form & tax regime","Review of the main choices between SAS, SASU, SARL or EURL and how they interact with the company’s tax regime."],["Articles & registration","Preparation of articles and filings through the French one-stop portal, including required beneficial-owner declarations."],["Annual corporate work","Annual approval of accounts, shareholder decisions, filing of accounts and associated formalities."],["Changes during the life of the company","Registered-office transfers, director changes, capital increases, share transfers and other routine amendments depending on the file."],["International group setup","Coordination of a French subsidiary, branch or, depending on the project, representative office, with working documents and communication available in English."]],"promiseEye":"Who we support","promiseTitle":"Support adapted to the company project.","promiseLead":"A first company, a new subsidiary and a foreign group entering France raise different questions.","promises":[["First-time founder","We frame the entity type, tax regime and formalities required for registration. Once incorporated, the accounting and tax setup can follow directly."],["Owner creating a holding or subsidiary","We coordinate formation with the existing group structure. Compensation and personal owner-manager matters are handled separately through our Owner-manager advisory service."],["International group entering France","We help structure the selected French vehicle and gather the required documentation in coordination with headquarters. Complex operations are handled with the group’s lawyers where needed."]],"processEye":"How we work","processTitle":"Four steps to operational launch.","processLead":"We separate the decisions to make, formalities to complete and post-registration setup.","process":[["Understand the project","We review the activity, shareholders, existing group and objectives of the new entity."],["Make a reasoned recommendation","We present the relevant entity and tax-regime options with their main implications for the project."],["Draft & file","We prepare documents within our scope and coordinate filing through the French one-stop portal and related formalities."],["Set up the company","After registration, we organise the accounting and tax start-up and the first recurring deadlines."]],"engagementEye":"Focus","engagementTitle":"From the decision to operational launch.","engagementValue":"End-to-end","engagementText":"We coordinate the routine steps from entity choice through registration. The file can then move directly into accounting and tax setup without creating separate information channels.","faqTitle":"Frequently asked questions","faq":[["Can a French company be incorporated fully remotely?","A large part of the process can be organised remotely. Feasibility still depends on the shareholders, documents to be signed and the specific formalities required. We identify any additional steps and documentation at the start."],["Do you support holding companies?","Yes, for formation and recurring corporate work within our scope. We review the holding company’s place in the group and coordinate the necessary formalities. Personal owner-manager matters are handled through our Owner-manager advisory service and complex operations with specialist advisers."],["Can you take over annual corporate work for an existing company?","Yes. We review articles, recent minutes, registers and other useful historical information. Future annual approvals and filings are then integrated into the engagement calendar."],["What documents are required for a foreign shareholder or director?","Requirements depend on the person’s status, country of residence and the entity being created. We prepare a file-specific document list and flag any translation, legalisation or additional formalities that may be required."],["Can you help us choose between a subsidiary and a branch?","Yes, within our scope and in coordination with your other advisers where needed. The choice depends on the desired autonomy, group organisation and accounting, tax and legal consequences. We review these factors before formalities begin."]],"finalTitle":"Let’s discuss your French company project.","finalText":"A first conversation reviews the activity, shareholders, group structure and formalities to address before incorporation begins.","finalCta":"Present your project","finalCtaSecondary":"Email RB Partners"}};</script>
